services:
  # The bucket store. 15.2 is the server generation Data Grid 8.x is built on; the app's 16.x client
  # negotiates down to it. Also what `mvn spring-boot:run` talks to on localhost:11222.
  infinispan:
    image: quay.io/infinispan/server:15.2
    container_name: rate-limiter-infinispan
    ports:
      - "11222:11222"
    environment:
      USER: ratelimiter
      PASS: ratelimiter

  rate-limiter:
    build: .
    image: rate-limiter:0.1.0-SNAPSHOT
    container_name: rate-limiter
    ports:
      - "8051:8051"
    environment:
      INFINISPAN_REMOTE_SERVER_LIST: infinispan:11222
      INFINISPAN_USERNAME: ratelimiter
      INFINISPAN_PASSWORD: ratelimiter
      # The server advertises its container address; BASIC keeps the client on the one above.
      INFINISPAN_REMOTE_CLIENT_INTELLIGENCE: BASIC
    depends_on:
      - infinispan
    restart: unless-stopped
