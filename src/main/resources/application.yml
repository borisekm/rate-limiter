spring:
  application:
    name: rate-limiter

server:
  port: 8051

# The Infinispan / Data Grid server holding the buckets, read by the Infinispan remote starter.
# Locally: the one in compose.yaml. Any key can be overridden from the environment, e.g.
# INFINISPAN_REMOTE_SERVER_LIST.
infinispan:
  remote:
    enabled: true
    server-list: localhost:11222
    use-auth: true
    auth-realm: default
    auth-username: ${INFINISPAN_USERNAME:ratelimiter}
    auth-password: ${INFINISPAN_PASSWORD:ratelimiter}
    # HASH_DISTRIBUTION_AWARE sends each request straight to the key's owner and needs the server pods'
    # own IPs to be reachable; BASIC talks only to server-list, for when they are not.
    client-intelligence: HASH_DISTRIBUTION_AWARE
    # Milliseconds. Bounds how long a check can hang while the server is gone.
    connect-timeout: 500
    socket-timeout: 2000
    # Not the starter's default (Java serialization): keys are strings and values Bucket4j's byte[],
    # both native to ProtoStream, so the server needs no schema and no Java allow-list.
    marshaller: org.infinispan.commons.marshall.ProtoStreamMarshaller
    # No Spring CacheManager on top: nothing here uses Spring's cache abstraction, and its cache
    # metrics list the server's caches at startup, so the app would not start without the store.
    cache:
      enabled: false

# One policy per resource from the Resource enum in the OpenAPI spec. Keys must match the
# enum's wire values exactly. Each policy applies per identifier: buckets are named
# <resource>@<identifier>, e.g. subjectSearch@10.0.0.7 or maxCallsSess@org-42.
# A bucket starts full and gains refill-tokens every refill-period, capped at capacity.
# Buckets are dropped once they would have refilled to capacity anyway (derived, not configured).
ratelimiter:
  # The answer while that server cannot be reached: allow (fail open) or deny (fail closed). The code
  # has no default; this is the local one, and each deployed environment sets its own in
  # k8s/configmap.yaml. Either way the answer carries an X-RateLimit-Degraded header and a warning is
  # logged.
  when-store-unavailable: deny
  # Whether the Hot Rod client checks the store's TLS certificate against infinispan.remote.sni-host-name
  # (only matters with use-ssl). Leave it on and set the SNI host name; turning it off makes the client
  # accept any certificate the trust store does, for any server - a temporary escape hatch for
  # ISPN004112 ("The SNI hostname is required when hostname validation is enabled").
  tls-hostname-validation: true
  resources:
    subjectSearch:            # calls into the subject service
      capacity: 15
      refill-tokens: 6
      refill-period: 60s
    newCases:
      capacity: 10
      refill-tokens: 10
      refill-period: 24h
    maxCallsIp:               # daily quota for our own service, per IP
      capacity: 100000
      refill-tokens: 100000
      refill-period: 24h
    maxCallsSess:             # daily quota for our own service, per session
      capacity: 100000
      refill-tokens: 100000
      refill-period: 12h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Lists bucketStore (is the Infinispan server reachable?) next to the rest. It is not part of
      # the readiness group: see BucketStoreHealthIndicator.
      show-components: always

---
# --- OpenShift / Kubernetes -------------------------------------------------------------------
# Activated by Spring's own cloud-platform detection (KUBERNETES_SERVICE_HOST is injected into
# every pod), not by a profile or an environment variable. That matters here: the Deployment comes
# from a central Helm chart we do not own, so anything the app can settle for itself is one less
# thing to negotiate. Every value below can still be overridden per environment.
spring:
  config:
    activate:
      on-cloud-platform: kubernetes

# The chart's Service publishes 8080 (traffic) and 8081 (actuator) by number, so those are the
# ports the container has to listen on - see k8s/README.md.
server:
  port: 8080
management:
  server:
    port: 8081
  endpoint:
    health:
      probes:
        enabled: true

# The Data Grid operator's defaults on OpenShift: TLS with a certificate signed by the service CA,
# which OpenShift mounts into every pod, and SCRAM credentials (INFINISPAN_USERNAME / _PASSWORD). The
# server address and the name its certificate is checked against are per environment - see
# k8s/configmap.yaml.
infinispan:
  remote:
    use-ssl: true
    trust-store-type: PEM
    trust-store-file-name: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
