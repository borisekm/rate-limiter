spring:
  application:
    name: rate-limiter
  cache:
    type: infinispan    # required for the starter to create the EmbeddedCacheManager bean;
                         # we still talk to the cache directly rather than via @Cacheable

server:
  port: 8051

# One policy per resource from the Resource enum in the OpenAPI spec. Keys must match the
# enum's wire values exactly. Each policy applies per identifier: buckets are named
# <resource>@<identifier>, e.g. subjectSearch@10.0.0.7 or maxCallsSess@org-42.
# A bucket starts full and gains refill-tokens every refill-period, capped at capacity.
# Buckets are dropped once they would have refilled to capacity anyway (derived, not configured).
ratelimiter:
  # cluster-name: rate-limiter   # nodes only cluster with nodes of the same name
  # JGroups stack. TCP in every environment; the files differ only in how members are discovered.
  # Local/dev uses MPING (multicast discovery). On OpenShift switch to DNS_PING:
  #   jgroups-config: org/infinispan/configuration/default-jgroups-kubernetes.xml
  # and set -Djgroups.dns.query=<headless-service>.<namespace>.svc.cluster.local
  # jgroups-config: org/infinispan/configuration/default-jgroups-tcp.xml
  persistence:
    enabled: true
    # Buckets are written here so they survive a restart of every node. Each node needs its own
    # directory - two nodes on one host must not share one. On OpenShift this means a StatefulSet
    # with a PVC per pod; see README.
    location: ./data/rate-limiter
  resources:
    subjectSearch:            # calls into the subject service
      capacity: 15
      refill-tokens: 6
      refill-period: 60s
    newCases:
      capacity: 10
      refill-tokens: 10
      refill-period: 24h
    maxCallsIp:               # daily quota for our own service, per IP
      capacity: 100000
      refill-tokens: 100000
      refill-period: 24h
    maxCallsSess:             # daily quota for our own service, per session
      capacity: 100000
      refill-tokens: 100000
      refill-period: 12h

infinispan:
  embedded:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

---
# --- OpenShift / Kubernetes -------------------------------------------------------------------
# Activated by Spring's own cloud-platform detection (KUBERNETES_SERVICE_HOST is injected into
# every pod), not by a profile or an environment variable. That matters here: the Deployment comes
# from a central Helm chart we do not own, so anything the app can settle for itself is one less
# thing to negotiate. Every value below can still be overridden per environment.
spring:
  config:
    activate:
      on-cloud-platform: kubernetes

# The chart's Service publishes 8080 (traffic) and 8081 (actuator) by number, so those are the
# ports the container has to listen on - see k8s/README.md.
server:
  port: 8080
management:
  server:
    port: 8081
  endpoint:
    health:
      probes:
        enabled: true

ratelimiter:
  # KUBE_PING, because the Service we are given is a ClusterIP with a virtual IP rather than a
  # headless one; see the header of jgroups-kubeping.xml.
  jgroups-config: jgroups-kubeping.xml
  persistence:
    # The chart gives pods no volume, and the SoftIndexFileStore must never be shared between
    # nodes - a store on the container filesystem would be a different, empty store after every
    # restart anyway. Buckets therefore live in memory, replicated (numOwners=2) across the
    # cluster: a rolling restart keeps them, a full stop of every pod resets quotas.
    enabled: false
