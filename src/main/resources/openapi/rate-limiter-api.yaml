openapi: 3.0.3
info:
  title: Rate Limiter API
  description: Distributed token-bucket rate limiter for internal microservices.
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: RateLimit

paths:
  /v1/rate/check:
    post:
      tags: [RateLimit]
      operationId: checkRate
      summary: Consume tokens for a key and report whether the call is allowed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRateRequest'
      responses:
        '200':
          description: Call is allowed; tokens have been consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRateResponse'
        '429':
          description: Limit exceeded; no tokens consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRateResponse'
        '400':
          description: Invalid request

  /v1/rate/reset:
    post:
      tags: [RateLimit]
      operationId: resetRate
      summary: Reset the bucket for a key, restoring its full limit
      description: >
        Deletes the bucket for the given resource and identifier. The next check starts from a
        full bucket. Idempotent: resetting a key that has no bucket also returns 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRateRequest'
      responses:
        '204':
          description: Bucket was reset (or did not exist)
        '400':
          description: Invalid request
        '503':
          description: Bucket store unreachable; nothing was reset

  /v1/rate/resources/{resource}/reset:
    post:
      tags: [RateLimit]
      operationId: resetResourceRate
      summary: Delete all buckets for a resource
      description: >
        Scans the shared cache and deletes buckets for this resource only. The next check
        for each identifier starts full using the serving instance's loaded policy.
        This operation is not atomic with concurrent checks. For parameter updates, pause
        checks and drain in-flight requests, load the new policy on all instances, reset,
        then resume checks. Retrying is safe but also resets buckets created since the previous call.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [subjectSearch, newCases, maxCallsIp, maxCallsSess, grustabfrage]
      responses:
        '204':
          description: Resource scan and deletion completed (including no matching buckets)
        '400':
          description: Invalid resource
        '503':
          description: Bucket store failure; some buckets may already have been deleted

components:
  schemas:
    CheckRateRequest:
      type: object
      required: [identifier, resource]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 512
        resource:
          type: string
          enum: [subjectSearch, newCases, maxCallsIp, maxCallsSess, grustabfrage]
          minLength: 1
          maxLength: 512

    CheckRateResponse:
      type: object
      required: [allowed, limit, remaining, retryAfterMillis]
      properties:
        allowed:
          type: boolean
        limit:
          type: integer
          format: int64
          description: Bucket capacity (max burst)
        remaining:
          type: integer
          format: int64
          description: Whole tokens left in the bucket after this call
        retryAfterMillis:
          type: integer
          format: int64
          description: Wait in milliseconds until enough tokens are available when refused, or until the next whole token accrues when allowed
