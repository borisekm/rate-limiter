# Stateless replicas: the buckets live in Data Grid, so pods can come and go in any order and
# every replica enforces the same shared limit. See k8s/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter
  labels:
    app.kubernetes.io/name: rate-limiter
    app.kubernetes.io/instance: rate-limiter
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rate-limiter
      app.kubernetes.io/instance: rate-limiter
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        # The platform's Service selects on these two.
        app.kubernetes.io/name: rate-limiter
        app.kubernetes.io/instance: rate-limiter
    spec:
      # Spread the replicas, but do not insist: a hard requirement would leave a replica Pending on
      # a small cluster.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rate-limiter
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        # No runAsUser: OpenShift's restricted SCC assigns the UID, and a hardcoded one is rejected.
        # The image needs no writable path of its own.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rate-limiter
          image: rate-limiter:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          # Fixed numbers, not names: the platform's Service targets ports by number.
          ports:
            - name: http
              containerPort: 8080
            - name: actuator
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: rate-limiter-config
            # RATELIMITER_INFINISPAN_USERNAME / _PASSWORD for Data Grid - see README.md.
            - secretRef:
                name: rate-limiter-datagrid
          env:
            # Answered-by identity: surfaces in the X-Served-By response header.
            - name: RATELIMITER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Actuator is on its own port (8081), which is how the chart's Service publishes it.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: actuator
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: actuator
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # The root filesystem is read-only; the JVM still wants a scratch directory.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
