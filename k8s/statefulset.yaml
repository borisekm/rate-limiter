# A StatefulSet, not a Deployment: every node keeps its own bucket store, so each replica
# needs a stable identity and its own volume. A Deployment with a shared or ephemeral store
# loses buckets whenever pods move - which for the 100k/day quotas means a day's allowance.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rate-limiter
  labels:
    app: rate-limiter
spec:
  serviceName: rate-limiter-headless
  replicas: 2
  podManagementPolicy: Parallel      # DNS_PING needs the peers up to discover each other
  selector:
    matchLabels:
      app: rate-limiter
  template:
    metadata:
      labels:
        app: rate-limiter
    spec:
      # One pod per node: the store is node-local (see storage.yaml), and two replicas on one
      # node would be two Infinispan nodes competing for the same kind of directory.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: rate-limiter
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # hostPath volumes get no ownership management from kubelet, so the mount arrives owned
      # by root and the app user cannot write its store. Drop this on a cluster whose
      # StorageClass honours fsGroup.
      initContainers:
        - name: chown-data
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /data/rate-limiter && chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: rate-limiter
          image: rate-limiter:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8051
            - name: jgroups
              containerPort: 7800
            - name: jgroups-fd
              containerPort: 57800     # FD_SOCK2 = bind port + 50000 offset
          envFrom:
            - configMapRef:
                name: rate-limiter-config
          env:
            # Answered-by identity: surfaces in the X-Served-By response header.
            - name: RATELIMITER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Declared before JGROUPS_DNS_QUERY: kubelet expands $(VAR) against entries above it.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JGROUPS_DNS_QUERY
              value: "$(JGROUPS_DNS_SERVICE).$(POD_NAMESPACE).svc.cluster.local"
            # JGroups resolves ${jgroups.*} from system properties, so these have to be -D
            # flags rather than plain environment variables.
            - name: JAVA_OPTS
              value: >-
                $(JAVA_HEAP_OPTS)
                -Djgroups.dns.query=$(JGROUPS_DNS_QUERY)
                -Djgroups.bind.port=7800
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      # Write-behind means a hard kill can lose the last few writes; give the store a moment.
      terminationGracePeriodSeconds: 45
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: rate-limiter-local
        resources:
          requests:
            storage: 1Gi
