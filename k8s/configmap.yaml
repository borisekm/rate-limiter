# What is left to configure per environment. Most of the OpenShift shape - ports 8080/8081, TLS to
# Data Grid with the service CA - the application settles for itself in application.yml, under
# `spring.config.activate.on-cloud-platform: kubernetes`, precisely because the Deployment comes
# from a chart we do not own. Everything here is an override on top of that, and Spring binds
# RATELIMITER_X_Y -> ratelimiter.x.y and INFINISPAN_REMOTE_X_Y -> infinispan.remote.x-y.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rate-limiter-config
  labels:
    app.kubernetes.io/name: rate-limiter
    app.kubernetes.io/instance: rate-limiter
data:
  # The Data Grid cluster's Service in this namespace: the operator names it after the Infinispan
  # CR (`oc get infinispan`), port 11222.
  INFINISPAN_REMOTE_SERVER_LIST: "datagrid:11222"
  # What the TLS certificate is checked against: the same Service's name, as the service CA issued it.
  INFINISPAN_REMOTE_SNI_HOST_NAME: "datagrid"
  # Escape hatch only: "false" stops checking the certificate against that name. Fix the name instead.
  # RATELIMITER_TLS_HOSTNAME_VALIDATION: "false"

  # The answer while Data Grid cannot be reached: "allow" (fail open) or "deny" (fail closed).
  # Chosen per environment on purpose. Degraded answers carry an X-RateLimit-Degraded header and
  # the app logs a warning at most every 30s while it lasts.
  RATELIMITER_WHEN_STORE_UNAVAILABLE: "deny"

  # Credentials are not here: INFINISPAN_USERNAME / _PASSWORD come from a Secret,
  # see README.md.

  # Heap ceiling inside the container limit.
  JAVA_OPTS: "-XX:MaxRAMPercentage=75"

  # The chart's Service also publishes a debug port (8090). Uncomment to actually listen on it:
  # JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8090"
