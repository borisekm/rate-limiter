# On sa-t this object belongs to the central Helm chart (bmf.brz.gv.at/managed-by:
# central-helmchart) - do not apply it there, drop it from kustomization.yaml instead. It is kept
# here so a test cluster can reproduce the same shape the chart produces. The chart still publishes
# the JGroups ports 7800/57800; nothing listens on them since the buckets moved to Data Grid.
#
# The chart's `clusterIP` and the bmf.brz.gv.at/* labels are omitted: they are assigned, not
# authored. What must match is the selector and the port numbers.
apiVersion: v1
kind: Service
metadata:
  name: rate-limiter
  labels:
    app.kubernetes.io/name: rate-limiter
    app.kubernetes.io/instance: rate-limiter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rate-limiter
    app.kubernetes.io/instance: rate-limiter
  ports:
    - name: tcp-8080
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: actuator-8081
      protocol: TCP
      port: 8081
      targetPort: 8081
    - name: debug-8090
      protocol: TCP
      port: 8090
      targetPort: 8090
    - name: jgroups-tcp7800
      protocol: TCP
      port: 7800
      targetPort: 7800
    - name: jgroups-fd-57800
      protocol: TCP
      port: 57800
      targetPort: 57800
---
# Test-cluster only: the chart's Service is ClusterIP, so there is no counterpart to this on sa-t
# (there a Route or the platform's ingress publishes the app). Reach it on
# http://<any node IP>:30851/v1/rate/check
apiVersion: v1
kind: Service
metadata:
  name: rate-limiter-nodeport
  labels:
    app.kubernetes.io/name: rate-limiter
    app.kubernetes.io/instance: rate-limiter
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rate-limiter
    app.kubernetes.io/instance: rate-limiter
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30851
