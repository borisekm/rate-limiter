# Lab-only image delivery. This cluster has no registry and its nodes cannot pull from an
# HTTP registry on the developer's host: containerd would need /etc/containerd/certs.d
# configured on every node. So each node runs its own registry on its own loopback -
# containerd resolves a "localhost:5000/..." reference over plain HTTP without any node
# configuration - and images are pushed into it with `kubectl port-forward`.
#
# The registries are independent: an image must be pushed to each node that will run it.
# A real environment replaces all of this with one shared registry.
apiVersion: v1
kind: Namespace
metadata:
  name: local-registry
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry
  namespace: local-registry
  labels:
    app: registry
spec:
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      # The point of the whole exercise: the registry listens on the node's own loopback.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Workers only - nothing schedules onto the control plane here.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - name: registry
              containerPort: 5000
              hostPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            periodSeconds: 5
          volumeMounts:
            - name: images
              mountPath: /var/lib/registry
      volumes:
        # On disk, so a pushed image survives a restart of the registry pod.
        - name: images
          hostPath:
            path: /var/lib/local-registry
            type: DirectoryOrCreate
